<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Kartu Profil</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <img src="https://i.pravatar.cc/150?img=3" alt="Foto Profil" class="avatar">
    <h2>Nama Kamu</h2>
    <p class="title">Web Developer</p>
    <p class="desc">Saya adalah pengembang web yang suka membuat aplikasi dan desain UI interaktif.</p>
    <div class="socials">
      <a href="#" title="GitHub"><i class="fa-brands fa-github"></i></a>
      <a href="#" title="LinkedIn"><i class="fa-brands fa-linkedin"></i></a>
      <a href="#" title="Instagram"><i class="fa-brands fa-instagram"></i></a>
    </div>
    <button onclick="alert('Halo! Terima kasih sudah mengunjungi profil saya.')">Hubungi Saya</button>
  </div>
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <script src="script.js"></script>
</body>
</html>
